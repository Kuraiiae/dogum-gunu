<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>Doğum Günün Kutlu Olsun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============ BURAYA RENKLERİ DEĞİŞTİREBİLİRSİN ============ */
:root{
  --gece:#0a1220;
  --gece-2:#0d1830;
  --panel:#0c1626;
  --altin:#c6a15b;
  --altin-acik:#e6cd90;
  --buz:#e6edf6;
  --gri:#93a3ba;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Jost','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color:var(--buz);
  background:
    radial-gradient(42% 34% at 50% 0%, rgba(46,74,120,.35), transparent 70%),
    radial-gradient(30% 26% at 12% 88%, rgba(198,161,91,.12), transparent 70%),
    radial-gradient(30% 26% at 88% 84%, rgba(198,161,91,.11), transparent 70%),
    linear-gradient(178deg,#0a1220 0%,#0d1830 60%,#0a1120 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  min-height:100vh;min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}

/* --- Yıldızlar ve altın toz zerrecikleri --- */
#ortam{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.yildiz{position:absolute;border-radius:50%;background:#dfe8f5;opacity:0;animation-name:isilti;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes isilti{0%,100%{opacity:.08;transform:scale(.7)}50%{opacity:.6;transform:scale(1.15)}}
.zerre{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#ecd9a8 0%,rgba(198,161,91,.8) 45%,transparent 72%);
  opacity:0;will-change:transform;
  animation-name:zerreYuksel;animation-timing-function:ease-in-out;animation-iteration-count:infinite;
}
@keyframes zerreYuksel{
  0%  {transform:translate3d(0,0,0) scale(.4);opacity:0}
  12% {opacity:.9}
  55% {transform:translate3d(18px,-52vh,0) scale(1)}
  100%{transform:translate3d(-14px,-108vh,0) scale(.55);opacity:.15}
}

/* --- Pusula halkaları (arkada yavaş döner) --- */
.pusula{position:fixed;left:50%;top:52%;width:min(96vw,560px);transform:translate(-50%,-50%);z-index:0;pointer-events:none;opacity:.85}
.pusula svg{width:100%;height:auto;display:block}
.halka-yavas{transform-box:fill-box;transform-origin:center;animation:cevirA 90s linear infinite}
.halka-hizli{transform-box:fill-box;transform-origin:center;animation:cevirB 70s linear infinite}
@keyframes cevirA{to{transform:rotate(360deg)}}
@keyframes cevirB{to{transform:rotate(-360deg)}}

.vinyet{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(2,6,14,.72) 100%)}

/* --- Kart --- */
main{position:relative;z-index:10;max-width:480px;margin:0 auto;padding:calc(2.1rem + env(safe-area-inset-top)) 1.15rem 7.5rem;text-align:center}
.kart{
  position:relative;
  background:linear-gradient(180deg,rgba(15,24,40,.92),rgba(10,17,30,.94));
  border:1px solid rgba(198,161,91,.35);
  padding:3rem 1.5rem 2.6rem;
  box-shadow:0 0 0 1px rgba(198,161,91,.1), 0 34px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(230,205,144,.12);
  animation:kartGel 1.15s ease-out .15s backwards;
}
@keyframes kartGel{from{opacity:0;transform:translateY(34px) scale(.985)}to{opacity:1;transform:none}}
.kart::before{
  content:"";position:absolute;inset:10px;border:1px solid rgba(198,161,91,.22);pointer-events:none;
}
.kart>*{position:relative;z-index:1}
.kose-elmas{position:absolute;width:7px;height:7px;border:1px solid rgba(198,161,91,.55);transform:rotate(45deg);z-index:2;pointer-events:none}
.kose-elmas.ke1{top:7px;left:7px}
.kose-elmas.ke2{bottom:7px;right:7px}

/* --- Amblem: ince pusula çemberi --- */
.amblem{position:relative;width:74px;height:74px;margin:0 auto 1.1rem}
.amblem .statik{position:absolute;inset:0;border:1px solid rgba(198,161,91,.4);border-radius:50%}
.amblem .statik::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:1px;background:linear-gradient(180deg,var(--altin),transparent 60%);transform:translateX(-50%) rotate(40deg)}
.amblem .statik::after{content:"◆";position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:var(--altin);font-size:.55rem}
.amblem .cevir{
  position:absolute;inset:8px;border:1px dashed rgba(198,161,91,.28);border-radius:50%;
  animation:cevirA 26s linear infinite;
}
.amblem .nokta{position:absolute;left:50%;top:50%;width:5px;height:5px;background:var(--altin);border-radius:50%;transform:translate(-50%,-50%)}

/* --- Üst satır --- */
.rozet{
  display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:1.05rem;
  font-weight:400;font-size:.74rem;letter-spacing:.42em;text-transform:uppercase;color:var(--altin);
}
.rozet::before,.rozet::after{content:"";width:30px;height:1px;flex-shrink:0}
.rozet::before{background:linear-gradient(90deg,transparent,var(--altin))}
.rozet::after{background:linear-gradient(90deg,var(--altin),transparent)}

.baslik{
  font-family:'Marcellus',Georgia,serif;font-weight:400;
  font-size:clamp(1.35rem,6.6vw,2rem);line-height:1.4;letter-spacing:.18em;
  text-transform:uppercase;color:var(--buz);
  text-shadow:0 2px 18px rgba(0,0,0,.5);
}
.ayrac{display:flex;align-items:center;justify-content:center;margin:.85rem 0 1rem;color:var(--altin);font-size:.5rem}
.ayrac::before,.ayrac::after{content:"";width:58px;height:1px;flex-shrink:0;background:rgba(198,161,91,.5)}
.ayrac::before{margin-right:.6rem}
.ayrac::after{margin-left:.6rem}

/* --- İsim: altın zeminde yavaş parıltı --- */
.isim{
  font-family:'Marcellus',Georgia,serif;font-weight:400;
  font-size:clamp(2.3rem,12.5vw,3.6rem);line-height:1.14;letter-spacing:.05em;
  background:linear-gradient(100deg,#8f6f35 0%,#c6a15b 20%,#e6cd90 38%,#c6a15b 55%,#8f6f35 78%,#d9bc7d 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  background-size:240% 100%;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));
  animation:isimGel 1.25s ease-out .7s backwards, altinAkim 8s ease-in-out 2.2s infinite;
}
@keyframes isimGel{from{opacity:0;transform:translateY(14px);letter-spacing:.22em}to{opacity:1;transform:none;letter-spacing:.05em}}
@keyframes altinAkim{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

/* --- Not --- */
.not{
  position:relative;background:rgba(13,22,38,.72);border:1px solid rgba(198,161,91,.3);
  padding:1.4rem 1.35rem 1.2rem;text-align:left;
  font-weight:300;font-size:1.06rem;line-height:1.9;color:#c7d3e2;letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(198,161,91,.14), 0 14px 34px -18px rgba(0,0,0,.8);
}
.not::before{
  content:"—";position:absolute;top:-.75rem;left:1.2rem;
  color:var(--altin);background:#0e1a2c;font-size:1rem;padding:0 .45rem;
}

/* --- Buton --- */
.btn{
  display:block;width:min(280px,86%);margin:1.8rem auto 0;
  background:transparent;border:1px solid rgba(198,161,91,.7);
  color:var(--altin-acik);
  font-weight:400;font-size:.94rem;letter-spacing:.34em;text-transform:uppercase;
  padding:1rem .9rem;min-height:52px;cursor:pointer;
  transition:background .5s,color .5s,box-shadow .5s;
  animation:btnGel 1s ease-out .85s backwards;
  touch-action:manipulation;
}
.btn:active{background:var(--altin);color:#0a1220;box-shadow:0 0 30px -6px rgba(198,161,91,.7)}
@keyframes btnGel{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* --- Giriş animasyonu (kademeli, sakin) --- */
.ent{opacity:0;animation:entGel .95s cubic-bezier(.25,1,.4,1) backwards}
.ent-0{animation-delay:.2s}
.ent-1{animation-delay:.4s}
.ent-2{animation-delay:.6s}
.ent-3{animation-delay:.8s}
.ent-4{animation-delay:1s}
@keyframes entGel{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* --- Alt not --- */
.altnot{
  position:fixed;left:0;right:0;bottom:0;z-index:12;text-align:center;
  padding:1rem 1rem calc(.9rem + env(safe-area-inset-bottom));
  font-weight:400;font-size:.88rem;letter-spacing:.05em;
  color:rgba(160,175,200,.55);
  background:linear-gradient(0deg,rgba(10,17,30,.92),rgba(10,17,30,0));
  pointer-events:none;
}
.kalpAt{display:inline-block;animation:kalpAt 1.5s ease-in-out infinite}
@keyframes kalpAt{0%,100%{transform:scale(1)}25%{transform:scale(1.28)}40%{transform:scale(1)}}

#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
}
</style>
</head>
<body>

<div class="pusula" aria-hidden="true">
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <g class="halka-yavas">
      <circle cx="150" cy="150" r="132" fill="none" stroke="rgba(198,161,91,.16)" stroke-width="1"/>
      <circle cx="150" cy="150" r="118" fill="none" stroke="rgba(198,161,91,.1)" stroke-width="1"/>
    </g>
    <g class="halka-hizli">
      <path d="M150 0 L150 22 M150 278 L150 300 M0 150 L22 150 M278 150 L300 150" stroke="rgba(198,161,91,.35)" stroke-width="1.2"/>
      <circle cx="150" cy="150" r="96" fill="none" stroke="rgba(198,161,91,.14)" stroke-width="1" stroke-dasharray="3 7"/>
    </g>
    <g fill="rgba(198,161,91,.6)">
      <path d="M150 12 L148 20 L150 18 L152 20 Z"/>
    </g>
    <polygon points="150,32 156,150 150,152 144,150" fill="rgba(198,161,91,.2)"/>
    <polygon points="150,268 156,150 150,148 144,150" fill="rgba(198,161,91,.14)"/>
  </svg>
</div>
<div class="vinyet" aria-hidden="true"></div>
<div id="ortam" aria-hidden="true"></div>
<canvas id="konfeti" aria-hidden="true"></canvas>

<main>
  <section class="kart">

    <span class="kose-elmas ke1" aria-hidden="true"></span>
    <span class="kose-elmas ke2" aria-hidden="true"></span>

    <div class="amblem ent ent-0" aria-hidden="true">
      <span class="cevir"></span>
      <span class="statik"></span>
      <span class="nokta"></span>
    </div>

    <div class="rozet ent ent-1">İyi ki doğdun</div>

    <h1 class="baslik ent ent-2">DOĞUM GÜNÜN<br>KUTLU OLSUN</h1>
    <div class="ayrac ent ent-3" aria-hidden="true"><span>◆</span></div>

    <h2 class="isim" id="isimYazisi">İSİM</h2>

    <div class="not ent ent-4">
      <p id="notYazisi">Senin için en güzel dileklerimle...</p>
    </div>

    <button class="btn" id="buton" type="button">🎉 Kutlamayı Başlat</button>

  </section>
</main>

<footer class="altnot"><span class="kalpAt" aria-hidden="true">❤️</span> QR ile gönderildi</footer>

<script>
// === GİZLİLİK KATMANI: Kilit ekranı ===
(function(){
var _p=new URLSearchParams(location.search),_a=_p.get('anahtar'),_sH=_p.get('sifre'),_sD=_p.get('sifreDuz');
if(!_a||!_sH){return}
document.documentElement.classList.add('kilitli');
var _st=document.createElement('style');
_st.textContent='html.kilitli body>*:not(#pgKilit){visibility:hidden!important}';
document.head.appendChild(_st);
var _ov=document.createElement('div');
_ov.id='pgKilit';
_ov.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#1f2537,#2c3146);color:#f2ead8;font-family:system-ui,sans-serif;text-align:center;padding:24px';
_ov.innerHTML='<div style="font-size:3rem">\uD83D\uDD12</div><h2 style="font-size:1.5rem;font-weight:700;margin:0">Kart Kilitli</h2><p style="font-size:.95rem;opacity:.85;margin:0">Do\u011Fum g\u00FCn\u00FCn\u00FC a\u00E7mak i\u00E7in PIN kodunu gir:</p><input id="pgPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:22px;letter-spacing:6px;text-align:center;padding:10px 14px;border-radius:10px;border:1px solid #c9a86a;background:rgba(255,255,255,.08);color:#fff;outline:none"><button id="pgAc" style="background:#c9a86a;color:#1f2537;font-weight:700;border-radius:999px;padding:10px 22px;border:none;cursor:pointer;font-size:1rem">\uD83D\uDD25 Kart\u0131 A\u00E7</button><p id="pgHata" style="display:none;color:#ff6b6b;font-size:.88rem;margin:0">PIN yanl\u0131\u015F, tekrar dene.</p>';
document.body.appendChild(_ov);
var _sk=document.createElement('style');
_sk.textContent='@keyframes pgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}';
document.head.appendChild(_sk);
var _pinI=document.getElementById('pgPin'),_btn=document.getElementById('pgAc'),_err=document.getElementById('pgHata');
function _h(d){if(typeof crypto!=='undefined'&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(d)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}return Promise.resolve(null)}
async function _ac(){var g=_pinI.value.trim();if(!g)return;var ok=false;if(_sH){var h=await _h(_a+'|'+g);if(h){ok=(h===_sH)}}if(!ok&&_sD){ok=(g===_sD)}if(ok){document.documentElement.classList.remove('kilitli');_ov.style.transition='opacity .4s';_ov.style.opacity='0';setTimeout(function(){_ov.remove()},420);document.querySelectorAll('*').forEach(function(el){var n=getComputedStyle(el).animationName;if(n&&n!=='none'){el.style.animation='none';void el.offsetWidth;el.style.animation=''}})}else{_err.style.display='block';_pinI.value='';_ov.style.animation='none';void _ov.offsetWidth;_ov.style.animation='pgShake .4s ease'}}
_btn.addEventListener('click',_ac);
_pinI.addEventListener('keydown',function(e){if(e.key==='Enter')_ac()});
})();

// ==================== BURAYA İSMİ VE NOTU YAZ ====================
const VARSAYILAN_ISIM = "İSİM";
const VARSAYILAN_NOT  = "Senin için en güzel dileklerimle...";
// =================================================================

// --- URL parametrelerinden isim ve notu oku (yoksa varsayılan) ---
var params = new URLSearchParams(location.search);
var ISIM = (params.get('isim') || '').trim() || VARSAYILAN_ISIM;
var NOT  = (params.get('not')  || '').trim() || VARSAYILAN_NOT;

// --- İsim ve notu yazdır ---
document.getElementById('isimYazisi').textContent = ISIM;
document.getElementById('notYazisi').textContent  = NOT;
document.title = 'Doğum günün kutlu olsun, ' + ISIM + '!';

// --- Yıldızlar ve altın toz zerrecikleri ---
var ortam = document.getElementById('ortam');
var i;
for (i = 0; i < 24; i++) {
  var y = document.createElement('span');
  y.className = 'yildiz';
  var sb = 1 + Math.random() * 1.6;
  y.style.width = sb.toFixed(1) + 'px';
  y.style.height = sb.toFixed(1) + 'px';
  y.style.left = (1 + Math.random() * 97) + '%';
  y.style.top = (1 + Math.random() * 96) + '%';
  y.style.animationDuration = (2.5 + Math.random() * 3.5) + 's';
  y.style.animationDelay = (Math.random() * 4) + 's';
  ortam.appendChild(y);
}
for (i = 0; i < 16; i++) {
  var z = document.createElement('span');
  z.className = 'zerre';
  var sz = 3 + Math.random() * 4;
  z.style.width = sz.toFixed(1) + 'px';
  z.style.height = sz.toFixed(1) + 'px';
  z.style.left = (3 + Math.random() * 92) + '%';
  z.style.animationDuration = (14 + Math.random() * 10) + 's';
  z.style.animationDelay = (Math.random() * 12) + 's';
  ortam.appendChild(z);
}

// --- Konfeti motoru ---
var cv = document.getElementById('konfeti');
var cx = cv.getContext('2d');
var renkler = ['#c6a15b', '#e6cd90', '#d9bc7d', '#8f6f35', '#f4e3bb', '#a8874a'];
var DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
function boyutla() {
  cv.width = Math.floor(innerWidth * DPR);
  cv.height = Math.floor(innerHeight * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
boyutla();
window.addEventListener('resize', boyutla);
var azHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var parcaciklar = [];

function patlat(x, y, adet) {
  for (var t = 0; t < adet; t++) {
    var aci = Math.random() * Math.PI * 2;
    var hiz = 1.6 + Math.random() * 3.8;
    parcaciklar.push({
      x: x, y: y,
      vx: Math.cos(aci) * hiz,
      vy: Math.sin(aci) * hiz - 2.6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.22,
      boy: 3.5 + Math.random() * 5.5,
      renk: renkler[(Math.random() * renkler.length) | 0],
      sekil: Math.random() < 0.3 ? 2 : (Math.random() < 0.5 ? 0 : 1),
      omur: 120 + Math.random() * 80,
      op: 1
    });
  }
}
function yagmur() {
  parcaciklar.push({
    x: Math.random() * innerWidth, y: -10,
    vx: (Math.random() - 0.5) * 0.35,
    vy: 0.3 + Math.random() * 0.65,
    rot: Math.random() * 6.28, vr: 0.012,
    boy: 3 + Math.random() * 4.5,
    renk: renkler[(Math.random() * renkler.length) | 0],
    sekil: Math.random() < 0.5 ? 0 : 1,
    omur: 360, op: 1
  });
}
var son = 0;
function dongu(zaman) {
  requestAnimationFrame(dongu);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  if (!azHareket && zaman - son > 800 && parcaciklar.length < 80) {
    son = zaman;
    yagmur();
  }
  for (var t = parcaciklar.length - 1; t >= 0; t--) {
    var p = parcaciklar[t];
    p.vy += 0.07; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.omur--;
    p.op = Math.min(1, p.omur / 85);
    if (p.y > innerHeight + 30 || p.omur <= 0) { parcaciklar.splice(t, 1); continue; }
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.max(0, p.op);
    cx.fillStyle = p.renk;
    if (p.sekil === 2) {
      cx.beginPath();
      cx.moveTo(0, -p.boy);
      cx.lineTo(p.boy, 0);
      cx.lineTo(0, p.boy);
      cx.lineTo(-p.boy, 0);
      cx.closePath();
      cx.fill();
    }
    else if (p.sekil === 0) { cx.fillRect(-p.boy / 2, -p.boy / 2, p.boy, p.boy * 0.6); }
    else { cx.beginPath(); cx.arc(0, 0, p.boy / 2, 0, 6.283); cx.fill(); }
    cx.restore();
  }
}
requestAnimationFrame(dongu);

// --- Açılışta sakin kutlama patlaması ---
setTimeout(function () {
  patlat(innerWidth * 0.5, innerHeight * 0.5, 70);
  setTimeout(function () { patlat(innerWidth * 0.25, innerHeight * 0.64, 40); }, 240);
  setTimeout(function () { patlat(innerWidth * 0.75, innerHeight * 0.58, 40); }, 480);
}, 500);

// --- Buton: büyük kutlama ---
var buton = document.getElementById('buton');
buton.addEventListener('click', function () {
  patlat(innerWidth * 0.5, innerHeight * 0.45, 120);
  setTimeout(function () { patlat(innerWidth * 0.2, innerHeight * 0.62, 65); }, 160);
  setTimeout(function () { patlat(innerWidth * 0.8, innerHeight * 0.5, 65); }, 320);
  buton.textContent = '🎊 Tekrar Kutla!';
});
</script>
</body>
</html>
