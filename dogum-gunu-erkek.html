<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<title>DOĞUM GÜNÜN KUTLU OLSUN ⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ BURAYA RENKLERİ DEĞİŞTİREBİLİRSİN ============ */
:root{
  --koyu:#0b0f24;
  --koyu-2:#141a3d;
  --kirmizi:#ff2b3a;
  --mavi:#2f6bff;
  --altin:#ffc933;
  --zifiri:#10142e;
  --beyaz:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Anton','Arial Black','Franklin Gothic Bold',Impact,sans-serif;
  background:var(--koyu);
  color:var(--beyaz);
  overflow-x:hidden;
  min-height:100vh;min-height:100dvh;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}

/* --- Halftone nokta deseni + parlama lekeleri --- */
.halftone{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1.5px, transparent 1.6px);
  background-size:20px 20px;
}
.parlama{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(60px)}
.parlama-kirmizi{width:430px;height:430px;background:radial-gradient(closest-side,rgba(255,43,58,.4),transparent 72%);top:-160px;left:-130px;animation:parlamaPuls 5.5s ease-in-out infinite alternate}
.parlama-mavi{width:460px;height:460px;background:radial-gradient(closest-side,rgba(47,107,255,.34),transparent 72%);bottom:-170px;right:-150px;animation:parlamaPuls 6.5s ease-in-out infinite alternate-reverse}
@keyframes parlamaPuls{from{opacity:.65}to{opacity:1}}
.vinyet{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(0,0,0,.55) 100%)}

/* --- Yıldırımlar (çizgi film tarzı flaş) --- */
.yildirim{position:fixed;z-index:1;pointer-events:none;filter:drop-shadow(0 0 12px #ffc933);opacity:0;animation:yildirimflik 7s infinite}
.yildirim-sol{left:10px;top:24%;width:36px;animation-delay:1.2s}
.yildirim-sag{right:10px;bottom:30%;width:30px;animation-delay:4.6s}
@keyframes yildirimflik{
  0%,82%,100%{opacity:0;transform:scale(.7) rotate(-8deg)}
  83%{opacity:1;transform:scale(1) rotate(0deg)}
  85%{opacity:.25}
  87%{opacity:1}
  90%{opacity:0}
}

/* --- Tam ekran flaş --- */
.flas{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;background:linear-gradient(140deg,#dce9ff,#ffe4e9)}
.flas.go{animation:flasGit .75s ease-out forwards}
@keyframes flasGit{0%{opacity:0}10%{opacity:.55}32%{opacity:.14}100%{opacity:0}}

/* --- Sahne --- */
.sahne{
  position:relative;z-index:10;max-width:480px;margin:0 auto;
  padding:calc(2.4rem + env(safe-area-inset-top)) 1.15rem 12.5rem;
  text-align:center;
}
.rozet{
  display:inline-block;background:var(--kirmizi);border:3px solid var(--zifiri);
  border-radius:8px;padding:.4rem 1.1rem;transform:rotate(-3deg);
  box-shadow:4px 4px 0 var(--zifiri), 0 0 22px rgba(255,43,58,.5);
  font-family:'Bangers','Impact','Arial Black',sans-serif;font-size:.98rem;
  letter-spacing:.16em;color:var(--altin);text-shadow:1.5px 1.5px 0 var(--zifiri);
}

/* --- Dönüşen amblem (kalkan + dişliler + şimşek) --- */
.amblem-sarici{position:relative;width:118px;height:128px;margin:1.25rem auto .9rem}
.burst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);animation:patPuls 3s ease-in-out infinite}
@keyframes patPuls{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.09);opacity:1}}
.amblem{
  position:absolute;inset:0;margin:auto;
  animation:emblemEnt 1.1s cubic-bezier(.3,1.5,.4,1) .1s both;
  filter:drop-shadow(0 6px 18px rgba(255,201,51,.28));
}
@keyframes emblemEnt{
  0%{transform:scale(.08) rotate(-220deg);opacity:0}
  52%{opacity:1;transform:scale(1.18) rotate(9deg)}
  66%{transform:scale(.94) rotate(-5deg) translateX(-5px)}
  78%{transform:scale(1.06) rotate(3deg) translateX(4px)}
  90%{transform:scale(.99) rotate(-1deg) translateX(-2px)}
  100%{transform:scale(1) rotate(0deg)}
}
#disliBuyuk{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
#disliKucuk{animation:spinR 5.5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}

/* --- Başlık --- */
.baslik-satir{position:relative;margin:.4rem 0 .9rem}
.baslik{
  position:relative;display:inline-block;
  font-size:clamp(1.55rem,7.6vw,2.35rem);line-height:1.22;letter-spacing:.03em;color:var(--beyaz);
  text-shadow:-2px -2px 0 rgba(47,107,255,.85), 2px 2px 0 var(--zifiri), 5px 5px 0 rgba(255,43,58,.8);
  animation:slam 1s cubic-bezier(.3,1.6,.4,1) .32s both;
}
@keyframes slam{
  0%{opacity:0;transform:scale(1.85) rotate(-3deg)}
  60%{opacity:1;transform:scale(.93) rotate(1.5deg)}
  78%{transform:scale(1.06) rotate(-1deg)}
  100%{transform:scale(1) rotate(0deg)}
}

/* --- İsim --- */
.isim-satir{position:relative;margin:.5rem 0 .7rem}
.isim{
  position:relative;display:inline-block;
  font-family:'Bangers','Impact','Arial Black',sans-serif;
  font-size:clamp(2.5rem,14vw,4rem);line-height:1.05;letter-spacing:.05em;color:var(--altin);
  -webkit-text-stroke:2.5px var(--zifiri);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--zifiri), 0 0 26px rgba(255,201,51,.5);
  animation:isimPat 1s cubic-bezier(.3,1.7,.4,1) .55s both;
}
@keyframes isimPat{
  0%{opacity:0;transform:scale(.2) rotate(-14deg)}
  55%{opacity:1;transform:scale(1.18) rotate(4deg)}
  75%{transform:scale(.94) rotate(-2deg)}
  100%{transform:scale(1) rotate(0deg)}
}
.kapow{
  position:absolute;top:-1.5rem;right:-.2rem;z-index:2;
  font-family:'Bangers','Impact',sans-serif;font-size:1.35rem;color:var(--kirmizi);
  -webkit-text-stroke:.9px var(--beyaz);text-shadow:2px 2px 0 var(--zifiri);
  transform:rotate(-10deg);opacity:0;animation:kapowPop .55s cubic-bezier(.3,1.8,.4,1) .8s forwards;
}
@keyframes kapowPop{
  0%{opacity:0;transform:scale(.2) rotate(20deg)}
  60%{opacity:1;transform:scale(1.35) rotate(-14deg)}
  100%{opacity:1;transform:scale(1) rotate(-10deg)}
}

/* --- Dilek paneli (çizgi roman paneli) --- */
.panel{
  position:relative;background:var(--beyaz);border:4px solid var(--zifiri);border-radius:16px;
  padding:1.25rem 1.15rem 1.15rem;transform:rotate(-1.2deg);
  box-shadow:6px 6px 0 rgba(0,0,0,.45), 0 0 0 3px var(--altin), 0 0 0 7px var(--zifiri);
  animation:panelGel .9s cubic-bezier(.25,1.4,.4,1) .75s both;
  overflow:hidden;
}
@keyframes panelGel{from{opacity:0;transform:rotate(-7deg) translateX(46px)}to{opacity:1;transform:rotate(-1.2deg) translateX(0)}}
.panel::after{
  content:"";position:absolute;top:-14px;right:-14px;width:74px;height:74px;
  background-image:radial-gradient(rgba(16,20,46,.18) 1.6px, transparent 1.7px);
  background-size:13px 13px;transform:rotate(8deg);
}
.panel-etiket{
  display:inline-block;background:var(--mavi);color:var(--beyaz);
  border:2.5px solid var(--zifiri);border-radius:6px;padding:.18rem .7rem;
  font-family:'Bangers',sans-serif;font-size:.82rem;letter-spacing:.14em;
  transform:rotate(-2deg);margin-bottom:.65rem;box-shadow:3px 3px 0 var(--zifiri);
}
.panel-metin{
  font-family:'Oswald','Trebuchet MS','Segoe UI',sans-serif;font-weight:500;font-size:1.06rem;
  line-height:1.6;color:var(--zifiri);text-align:left;
}

/* --- Buton --- */
.buton-satir{position:relative;margin-top:2rem}
.btn-satir-nisani{position:absolute;left:50%;top:50%;width:250px;height:118px;transform:translate(-50%,-50%) scale(1);z-index:0;animation:patPuls 2.6s ease-in-out infinite}
.btn{
  position:relative;z-index:1;display:inline-block;min-height:60px;
  background:linear-gradient(180deg,#ff4754 0%,#d3132a 100%);
  border:3px solid var(--zifiri);border-radius:12px;transform:rotate(-1.3deg);
  box-shadow:5px 5px 0 var(--zifiri), 0 0 28px rgba(255,43,58,.5), inset 0 3px 0 rgba(255,255,255,.28);
  color:var(--beyaz);font-family:'Bangers',sans-serif;font-size:1.4rem;letter-spacing:.06em;
  padding:.85rem 1.7rem;cursor:pointer;touch-action:manipulation;
  animation:butonPat 1s cubic-bezier(.3,1.7,.4,1) 1.05s both;
}
@keyframes butonPat{0%{opacity:0;transform:scale(.1) rotate(20deg)}55%{opacity:1;transform:scale(1.22) rotate(-4deg)}75%{transform:scale(.94) rotate(-1deg)}100%{transform:scale(1) rotate(-1.3deg)}}
.btn:active{transform:translate(4px,4px) rotate(-1.3deg);box-shadow:1px 1px 0 var(--zifiri)}

/* --- Pist ve yarışan araba --- */
.pist{
  position:fixed;left:0;right:0;bottom:0;z-index:4;height:62px;
  background:#20263f;border-top:4px solid var(--altin);
  pointer-events:none;overflow:hidden;
}
.pist::before,.pist::after{
  content:"";position:absolute;left:0;right:0;height:9px;
  background:repeating-linear-gradient(45deg,#fff 0 8px,var(--zifiri) 8px 16px);
}
.pist::before{top:0}
.pist::after{bottom:0}
.yol-cizgi{
  position:absolute;left:0;right:0;top:27px;height:6px;
  background:repeating-linear-gradient(90deg,var(--altin) 0 22px, transparent 22px 34px);
  animation:yolKay .9s linear infinite;
}
@keyframes yolKay{to{background-position-x:-68px}}
.arac-kapsul{
  position:absolute;top:13px;left:0;width:150px;
  animation:yaris 6s linear infinite;will-change:transform;
}
.kapasitif .arac-kapsul{animation-duration:2.4s}
@keyframes yaris{0%{transform:translateX(-170px)}100%{transform:translateX(calc(100vw + 60px))}}
.arac{width:150px;height:60px;animation:zipla .48s ease-in-out infinite alternate}
@keyframes zipla{from{transform:translateY(0) rotate(.8deg)}to{transform:translateY(-5px) rotate(-.8deg)}}
.teker{animation:spin .45s linear infinite;transform-box:fill-box;transform-origin:center}
.hiz-cizgileri span{
  position:absolute;bottom:13px;display:block;height:5px;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75));
  opacity:0;animation:hizCiz .5s linear infinite;
}
.hiz-cizgileri span:nth-child(1){left:-26px;width:44px}
.hiz-cizgileri span:nth-child(2){left:-58px;width:60px;animation-delay:.16s;bottom:26px}
.hiz-cizgileri span:nth-child(3){left:-40px;width:34px;animation-delay:.3s;bottom:38px}
@keyframes hizCiz{0%{transform:translateX(12px);opacity:0}25%{opacity:.9}100%{transform:translateX(-120px);opacity:0}}
.vrooom{
  position:absolute;top:-26px;right:16px;
  font-family:'Bangers',sans-serif;font-size:1.5rem;letter-spacing:.06em;color:var(--altin);
  text-shadow:2px 2px 0 var(--zifiri);opacity:0;
  animation:vrooomPop 6s linear infinite;animation-delay:1.15s;
}
@keyframes vrooomPop{
  0%,9%,100%{opacity:0;transform:scale(.4) rotate(-8deg)}
  11%{opacity:1;transform:scale(1.2) rotate(-3deg)}
  14%{transform:scale(1) rotate(-5deg)}
  38%{opacity:0;transform:scale(.9) translateY(-14px)}
}

/* --- Uçan KA-POW (butona basınca) --- */
.kapowUcan{
  position:fixed;z-index:30;pointer-events:none;
  font-family:'Bangers',sans-serif;font-size:2rem;color:var(--altin);
  -webkit-text-stroke:1.2px var(--zifiri);text-shadow:2px 2px 0 var(--kirmizi);
  animation:kapowUc 1.15s ease-out forwards;
}
@keyframes kapowUc{
  0%{opacity:0;transform:scale(.3) rotate(-14deg)}
  20%{opacity:1;transform:scale(1.3) rotate(6deg)}
  100%{opacity:0;transform:scale(1) translateY(-70px) rotate(-4deg)}
}

/* --- Alt not --- */
.altnot{
  position:fixed;left:0;right:0;bottom:0;z-index:12;text-align:center;
  padding:.55rem 1rem calc(.62rem + env(safe-area-inset-bottom));
  font-family:'Oswald','Trebuchet MS',sans-serif;font-weight:500;font-size:.88rem;
  letter-spacing:.04em;color:rgba(255,255,255,.72);pointer-events:none;
}
.kalpAt{display:inline-block;animation:kalpAt 1.5s ease-in-out infinite}
@keyframes kalpAt{0%,100%{transform:scale(1)}25%{transform:scale(1.28)}40%{transform:scale(1)}}

#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
}
</style>
</head>
<body>

<div class="halftone" aria-hidden="true"></div>
<div class="parlama parlama-kirmizi" aria-hidden="true"></div>
<div class="parlama parlama-mavi" aria-hidden="true"></div>
<div class="vinyet" aria-hidden="true"></div>

<svg class="yildirim yildirim-sol" viewBox="0 0 32 60" aria-hidden="true">
  <path d="M19 2 L4 34 H14 L11 58 L28 24 H17 L25 2 Z" fill="#ffc933" stroke="#10142e" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
<svg class="yildirim yildirim-sag" viewBox="0 0 32 60" aria-hidden="true">
  <path d="M19 2 L4 34 H14 L11 58 L28 24 H17 L25 2 Z" fill="#ffc933" stroke="#10142e" stroke-width="2.5" stroke-linejoin="round"/>
</svg>

<div class="flas" id="flas" aria-hidden="true"></div>
<canvas id="konfeti" aria-hidden="true"></canvas>

<main class="sahne">

  <div class="rozet">★ ÖZEL SAYI! ★</div>

  <div class="amblem-sarici">
    <svg class="burst" viewBox="0 0 100 100" width="190" height="190" aria-hidden="true">
      <polygon data-n="12" data-d1="47" data-d2="40" fill="#ffc933" opacity=".55"/>
    </svg>
    <svg class="amblem" viewBox="0 0 120 130" width="116" height="126" aria-hidden="true">
      <path d="M60 6 L108 26 V64 C108 98 88 118 60 124 C32 118 12 98 12 64 V26 Z" fill="#10142e" stroke="#ffc933" stroke-width="5" stroke-linejoin="round"/>
      <path d="M60 15 L100 32 V64 C100 93 83 111 60 116 C37 111 20 93 20 64 V32 Z" fill="none" stroke="rgba(255,201,51,.3)" stroke-width="2.5"/>
      <g id="disliBuyuk"></g>
      <g id="disliKucuk"></g>
      <path d="M64 40 L47 71 L60 71 L53.5 96 L82 63 L66 63 L76 40 Z" fill="#ffc933" stroke="#10142e" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#ffc933" stroke-width="1.6" stroke-linecap="round">
        <path d="M24 30 L30 24"/><path d="M96 24 L102 18"/>
        <path d="M98 92 L92 98"/><path d="M18 94 L24 88"/>
      </g>
    </svg>
  </div>

  <div class="baslik-satir">
    <svg class="burst" viewBox="0 0 100 100" width="300" height="300" aria-hidden="true">
      <polygon data-n="14" data-d1="48" data-d2="41" fill="#ff2b3a" opacity=".65"/>
    </svg>
    <h1 class="baslik">DOĞUM GÜNÜN<br>KUTLU OLSUN</h1>
  </div>

  <div class="isim-satir">
    <svg class="burst" viewBox="0 0 100 100" width="280" height="280" aria-hidden="true">
      <polygon data-n="12" data-d1="47" data-d2="40" fill="#2f6bff" opacity=".6"/>
    </svg>
    <h2 class="isim" id="isimYazisi">İSİM</h2>
    <span class="kapow" aria-hidden="true">KA-POW!</span>
  </div>

  <div class="panel">
    <span class="panel-etiket">⚡ DİLEK PANELİ</span>
    <p class="panel-metin" id="notYazisi">Senin için en güzel dileklerimle...</p>
  </div>

  <div class="buton-satir">
    <svg class="btn-satir-nisani" viewBox="0 0 100 100" aria-hidden="true">
      <polygon data-n="12" data-d1="47" data-d2="40" fill="#ffc933" opacity=".7"/>
    </svg>
    <button class="btn" id="buton" type="button">🎉 KUTLAMAYI BAŞLAT</button>
  </div>

</main>

<div class="pist" aria-hidden="true">
  <div class="yol-cizgi"></div>
  <div class="arac-kapsul" id="aracKapsul">
    <div class="hiz-cizgileri"><span></span><span></span><span></span></div>
    <svg class="arac" viewBox="0 0 150 62">
      <path d="M10 42 L10 31 Q10 24 19 24 L34 24 Q40 15 56 13 L88 13 Q100 13 106 20 L112 20" fill="none"/>
      <rect x="12" y="24" width="130" height="19" rx="11" fill="#ff2b3a"/>
      <rect x="12" y="36" width="130" height="4.5" fill="#ffc933"/>
      <path d="M58 13 Q64 6 74 6 L88 6 Q98 6 104 13 Z" fill="#ff2b3a"/>
      <rect x="72" y="9" width="17" height="9" rx="3" fill="#cfe0ff"/>
      <path d="M90 9 L100 15 L101 20 L91 20 Z" fill="#ccdeff"/>
      <rect x="46" y="2" width="16" height="7" rx="2.5" fill="#c31328"/>
      <rect x="50" y="0" width="9" height="9" rx="2" fill="#c31328"/>
      <circle cx="132" cy="32" r="3.4" fill="#ffe9b0"/>
      <circle cx="16" cy="30" r="3" fill="#8f0f1e"/>
      <g class="teker">
        <g transform="translate(40 45)">
          <circle r="11.5" fill="#10142e" stroke="#ffc933" stroke-width="2.5"/>
          <circle r="4.6" fill="#ffc933"/>
          <rect x="-1.6" y="-9" width="3.2" height="18" rx="1.2" fill="#eaeeff"/>
          <rect x="-9" y="-1.6" width="18" height="3.2" rx="1.2" fill="#eaeeff"/>
        </g>
      </g>
      <g class="teker">
        <g transform="translate(102 45)">
          <circle r="11.5" fill="#10142e" stroke="#ffc933" stroke-width="2.5"/>
          <circle r="4.6" fill="#ffc933"/>
          <rect x="-1.6" y="-9" width="3.2" height="18" rx="1.2" fill="#eaeeff"/>
          <rect x="-9" y="-1.6" width="18" height="3.2" rx="1.2" fill="#eaeeff"/>
        </g>
      </g>
    </svg>
  </div>
  <span class="vrooom">VRROOOM!</span>
</div>

<footer class="altnot"><span class="kalpAt" aria-hidden="true">❤️</span> QR ile gönderildi</footer>

<script>
// ==================== BURAYA İSMİ VE NOTU YAZ ====================
const VARSAYILAN_ISIM = "İSİM";
const VARSAYILAN_NOT  = "Senin için en güzel dileklerimle...";
// =================================================================

// --- URL parametrelerinden isim ve notu oku (yoksa varsayılan) ---
var params = new URLSearchParams(location.search);
var ISIM = (params.get('isim') || '').trim() || VARSAYILAN_ISIM;
var NOT  = (params.get('not')  || '').trim() || VARSAYILAN_NOT;

// --- İsim ve notu yazdır ---
document.getElementById('isimYazisi').textContent = ISIM;
document.getElementById('notYazisi').textContent  = NOT;
document.title = 'Doğum günün kutlu olsun, ' + ISIM + '! ⚡';

// --- Çizgi roman yıldız patlamaları üret ---
function yildizPatlamasi(nokta, d1, d2) {
  var p = '';
  for (var i = 0; i < nokta * 2; i++) {
    var aci = (Math.PI * i) / nokta - Math.PI / 2;
    var r = i % 2 === 0 ? d1 : d2;
    p += (50 + r * Math.cos(aci)).toFixed(2) + ',' + (50 + r * Math.sin(aci)).toFixed(2) + ' ';
  }
  return p;
}
var burstlar = document.querySelectorAll('.burst polygon');
for (var b = 0; b < burstlar.length; b++) {
  var el = burstlar[b];
  var n = parseInt(el.getAttribute('data-n'), 10) || 12;
  var d1 = parseFloat(el.getAttribute('data-d1')) || 46;
  var d2 = parseFloat(el.getAttribute('data-d2')) || 40;
  el.setAttribute('points', yildizPatlamasi(n, d1, d2));
}

// --- Kalkan içindeki dişliler ---
function disli(dis, r, renk) {
  var s = '';
  var y = Math.round(r - 6);
  for (var k = 0; k < dis; k++) {
    var a = k * 360 / dis;
    s += '<rect x="-6" y="' + y + '" width="12" height="16" rx="3" fill="' + renk + '" transform="rotate(' + a + ')"/>';
  }
  s += '<circle r="' + r + '" fill="#10142e" stroke="' + renk + '" stroke-width="4"/>';
  s += '<circle r="' + Math.round(r * 0.42) + '" fill="none" stroke="' + renk + '" stroke-width="3.5" stroke-dasharray="7 9"/>';
  return s;
}
document.getElementById('disliBuyuk').innerHTML = disli(8, 24, '#ffc933');
document.getElementById('disliKucuk').innerHTML = disli(6, 15, '#2f6bff');

// --- Konfeti motoru ---
var cv = document.getElementById('konfeti');
var cx = cv.getContext('2d');
var renkler = ['#ff2b3a', '#2f6bff', '#ffc933', '#ffffff', '#ff8a3d'];
var DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
function boyutla() {
  cv.width = Math.floor(innerWidth * DPR);
  cv.height = Math.floor(innerHeight * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
boyutla();
window.addEventListener('resize', boyutla);
var azHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var parcaciklar = [];

function patlat(x, y, adet) {
  for (var t = 0; t < adet; t++) {
    var aci = Math.random() * Math.PI * 2;
    var hiz = 2.5 + Math.random() * 6;
    parcaciklar.push({
      x: x, y: y,
      vx: Math.cos(aci) * hiz,
      vy: Math.sin(aci) * hiz - 3.6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.34,
      boy: 5 + Math.random() * 8,
      renk: renkler[(Math.random() * renkler.length) | 0],
      sekil: Math.random() < 0.5 ? 0 : 1,
      omur: 100 + Math.random() * 70,
      op: 1
    });
  }
}
function yagmur() {
  parcaciklar.push({
    x: Math.random() * innerWidth, y: -10,
    vx: (Math.random() - 0.5) * 0.7,
    vy: 0.6 + Math.random() * 1.3,
    rot: Math.random() * 6.28, vr: 0.02,
    boy: 4 + Math.random() * 6,
    renk: renkler[(Math.random() * renkler.length) | 0],
    sekil: Math.random() < 0.5 ? 0 : 1,
    omur: 300, op: 1
  });
}
var son = 0;
function dongu(zaman) {
  requestAnimationFrame(dongu);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  if (!azHareket && zaman - son > 480 && parcaciklar.length < 150) {
    son = zaman;
    yagmur();
  }
  for (var t = parcaciklar.length - 1; t >= 0; t--) {
    var p = parcaciklar[t];
    p.vy += 0.1; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.omur--;
    p.op = Math.min(1, p.omur / 70);
    if (p.y > innerHeight + 30 || p.omur <= 0) { parcaciklar.splice(t, 1); continue; }
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.max(0, p.op);
    cx.fillStyle = p.renk;
    if (p.sekil === 0) { cx.fillRect(-p.boy / 2, -p.boy / 2, p.boy, p.boy * 0.6); }
    else { cx.beginPath(); cx.arc(0, 0, p.boy / 2, 0, 6.283); cx.fill(); }
    cx.restore();
  }
}
requestAnimationFrame(dongu);

// --- Ekran flaşı ---
var flas = document.getElementById('flas');
function flasYap() {
  flas.classList.remove('go');
  void flas.offsetWidth;
  flas.classList.add('go');
}

// --- Uçan KA-POW kelimeleri ---
var kelimeler = ['KA-POW!', 'ZAP!', 'BAM!', 'VRROOOM!', 'ÇILGIN!'];
function kapowFirlat() {
  var k = document.createElement('span');
  k.className = 'kapowUcan';
  k.textContent = kelimeler[(Math.random() * kelimeler.length) | 0];
  k.style.left = (6 + Math.random() * 68) + '%';
  k.style.top = (16 + Math.random() * 52) + '%';
  k.style.transform = 'rotate(' + (Math.random() * 18 - 9) + 'deg)';
  document.body.appendChild(k);
  setTimeout(function () { k.remove(); }, 1200);
}

// --- Açılışta kutlama patlaması ---
setTimeout(function () { flasYap(); }, 250);
setTimeout(function () {
  patlat(innerWidth * 0.5, innerHeight * 0.45, 120);
  setTimeout(function () { patlat(innerWidth * 0.2, innerHeight * 0.6, 70); }, 180);
  setTimeout(function () { patlat(innerWidth * 0.8, innerHeight * 0.52, 70); }, 360);
  setTimeout(kapowFirlat, 150);
  setTimeout(kapowFirlat, 500);
}, 400);

// --- Buton: büyük kutlama ---
var buton = document.getElementById('buton');
var kapsul = document.getElementById('aracKapsul');
buton.addEventListener('click', function () {
  flasYap();
  patlat(innerWidth * 0.5, innerHeight * 0.42, 160);
  setTimeout(function () { patlat(innerWidth * 0.16, innerHeight * 0.6, 85); }, 150);
  setTimeout(function () { patlat(innerWidth * 0.84, innerHeight * 0.5, 85); }, 300);
  kapowFirlat();
  setTimeout(kapowFirlat, 250);
  setTimeout(kapowFirlat, 500);
  kapsul.parentNode.classList.add('kapasitif');
  setTimeout(function () { kapsul.parentNode.classList.remove('kapasitif'); }, 3000);
  buton.textContent = '🎉 TEKRAR KUTLA!';
});
</script>
</body>
