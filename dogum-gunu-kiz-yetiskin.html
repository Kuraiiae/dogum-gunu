<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ecdd">
<title>Doğum Günün Kutlu Olsun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="zarf-motoru.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
/* ============ BURAYA RENKLERİ DEĞİŞTİREBİLİRSİN ============ */
:root{
  --krem:#f7f1e6;
  --krem-2:#f3e9d9;
  --blush:#f3d9ce;
  --gul:#c98a7d;
  --gul-koyu:#a86b5e;
  --altin:#b98a3e;
  --altin-acik:#d9b36a;
  --altin-parlak:#e8cf8f;
  --murekkep:#4a3f35;
  --murekkep-acik:#8a7a6a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Cormorant Garamond',Georgia,serif;
  color:var(--murekkep);
  background:linear-gradient(170deg,#f9f4ec 0%,#f6ecdd 40%,#f8eee5 80%,#f3e6d8 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  min-height:100vh;min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}

/* --- Yumuşak ışıklar ve vinyet --- */
.isik{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}
.isik-blush{width:400px;height:400px;background:radial-gradient(closest-side,rgba(219,152,133,.35),transparent 72%);top:-150px;left:-130px}
.isik-altin{width:420px;height:420px;background:radial-gradient(closest-side,rgba(185,138,62,.26),transparent 72%);bottom:-160px;right:-140px}
.vinyet{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(120,90,50,.12) 100%)}

/* --- Süzülen gül yaprakları --- */
#ortam{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-50px;opacity:0;will-change:transform;animation-name:petalDus;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes petalDus{
  0%  {transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  8%  {opacity:.95}
  45% {transform:translate3d(34px,48vh,0) rotate(105deg)}
  75% {transform:translate3d(-24px,82vh,0) rotate(215deg)}
  100%{transform:translate3d(12px,112vh,0) rotate(320deg);opacity:.8}
}

/* --- Kart --- */
main{position:relative;z-index:10;max-width:480px;margin:0 auto;padding:calc(1.9rem + env(safe-area-inset-top)) 1.15rem 7.5rem;text-align:center}
.kart{
  position:relative;background:#fffdf8;
  border:1px solid rgba(185,138,62,.6);
  border-radius:3px;
  padding:2.6rem 1.5rem 2.5rem;
  box-shadow:0 0 0 5px #fffdf8, 0 0 0 6px rgba(185,138,62,.32), 0 30px 60px -28px rgba(120,90,50,.35);
}
.kart>*{position:relative;z-index:1}
.parlaklik{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:3px;pointer-events:none}
.parlaklik::before{
  content:"";position:absolute;inset:-20%;
  background:linear-gradient(115deg,transparent 42%,rgba(232,207,143,.5) 50%,transparent 58%);
  background-size:250% 120%;
  animation:altinGez 6.5s ease-in-out infinite;
}
@keyframes altinGez{0%{background-position:130% 0}55%{background-position:-60% 0}100%{background-position:-60% 0}}
.koseler{position:absolute;top:10px;left:10px;width:calc(100% - 20px);height:calc(100% - 20px);z-index:0;pointer-events:none}

/* --- Amblem (gül + ince halkalar) --- */
.amblem{position:relative;width:86px;height:86px;margin:0 auto 1.15rem}
.amblem .halka{position:absolute;inset:0;border:1px solid rgba(185,138,62,.55);border-radius:50%}
.amblem .halka-2{position:absolute;inset:5px;border:1px solid rgba(185,138,62,.32);border-radius:50%}
.amblem svg{position:absolute;inset:0;animation:altinIsil 5s ease-in-out infinite}
@keyframes altinIsil{0%,100%{filter:drop-shadow(0 0 2px rgba(185,138,62,.25))}50%{filter:drop-shadow(0 0 9px rgba(217,179,106,.55))}}

/* --- Üst satır: ince çizgiler arasında başlık --- */
.rozet{
  display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.1rem;
  font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:.72rem;
  letter-spacing:.34em;text-transform:uppercase;color:var(--altin);
}
.rozet::before,.rozet::after{content:"";width:38px;height:1px;flex-shrink:0}
.rozet::before{background:linear-gradient(90deg,transparent,#b98a3e)}
.rozet::after{background:linear-gradient(90deg,#b98a3e,transparent)}

.baslik{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;
  font-size:clamp(1.35rem,6.6vw,2rem);line-height:1.35;letter-spacing:.12em;
  text-transform:uppercase;color:var(--murekkep);
}
.ayrac{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:.85rem 0;color:var(--altin);font-size:.58rem}
.ayrac::before,.ayrac::after{content:"";width:52px;height:1px;flex-shrink:0}
.ayrac::before{background:var(--altin);opacity:.55}
.ayrac::after{background:var(--altin);opacity:.55}

/* --- İsim: altın varak parıltısı --- */
.isim{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-style:italic;
  font-size:clamp(2.5rem,13.5vw,3.9rem);line-height:1.12;
  background:linear-gradient(100deg,#a87b35 0%,#d9b36a 25%,#8a5f2a 50%,#e0c183 75%,#a87b35 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  background-size:250% 100%;
  filter:drop-shadow(0 2px 6px rgba(185,138,62,.25));
  animation:isimGel 1.2s ease-out .8s backwards, altinAkim 8s ease-in-out 2.4s infinite;
}
@keyframes isimGel{from{opacity:0;transform:translateY(12px) scale(.97);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes altinAkim{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

/* --- Not --- */
.not{
  position:relative;background:#fbf6ec;border:1px solid rgba(185,138,62,.4);border-radius:2px;
  padding:1.45rem 1.3rem 1.2rem;text-align:left;
  font-weight:500;font-size:1.08rem;line-height:1.85;color:var(--murekkep-acik);
  box-shadow:inset 0 0 0 4px #fbf6ec, inset 0 0 0 5px rgba(185,138,62,.25);
}
.not::before{
  content:"❝";position:absolute;top:.2rem;left:.7rem;
  font-family:'Playfair Display',serif;font-size:2.1rem;line-height:1;
  color:rgba(185,138,62,.55);
}

/* --- Buton --- */
.btn{
  display:block;width:min(280px,86%);margin:1.7rem auto 0;
  background:transparent;border:1px solid var(--altin);border-radius:2px;
  color:var(--altin);
  font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:.98rem;
  letter-spacing:.3em;text-transform:uppercase;
  padding:.95rem 1rem;min-height:52px;cursor:pointer;
  transition:background .35s,color .35s,box-shadow .35s,transform .15s;
  animation:btnGel .9s ease-out .9s backwards;
  touch-action:manipulation;
}
.btn:active{background:linear-gradient(120deg,#b98a3e,#d9b36a);color:#fffdf8;box-shadow:0 10px 24px -10px rgba(185,138,62,.6)}
@keyframes btnGel{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hop{animation:hop .6s ease-in-out}
@keyframes hop{0%{transform:scale(1)}35%{transform:scale(1.1)}70%{transform:scale(.96)}100%{transform:scale(1)}}

/* --- Giriş animasyonu (film gibi: bulanıklıktan netliğe) --- */
.ent{opacity:0;animation:entGel .95s ease-out backwards}
.ent-0{animation-delay:.12s}
.ent-1{animation-delay:.28s}
.ent-2{animation-delay:.42s}
.ent-3{animation-delay:.56s}
.ent-4{animation-delay:.7s}
.ent-5{animation-delay:.84s}
@keyframes entGel{from{opacity:0;transform:translateY(16px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}

/* --- Alt not --- */
.altnot{
  position:fixed;left:0;right:0;bottom:0;z-index:12;text-align:center;
  padding:1rem 1rem calc(.9rem + env(safe-area-inset-bottom));
  font-weight:600;font-size:.9rem;letter-spacing:.04em;
  color:rgba(74,63,53,.6);
  background:linear-gradient(0deg,rgba(247,241,230,.9),rgba(247,241,230,0));
  pointer-events:none;
}
.kalpAt{display:inline-block;animation:kalpAt 1.5s ease-in-out infinite}
@keyframes kalpAt{0%,100%{transform:scale(1)}25%{transform:scale(1.28)}40%{transform:scale(1)}}

#konfeti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
}
</style>
</head>
<body>

<div class="isik isik-blush" aria-hidden="true"></div>
<div class="isik isik-altin" aria-hidden="true"></div>
<div class="vinyet" aria-hidden="true"></div>
<div id="ortam" aria-hidden="true"></div>
<canvas id="konfeti" aria-hidden="true"></canvas>

<main>
  <section class="kart ent ent-0">

    <div class="parlaklik" aria-hidden="true"></div>
    <svg class="koseler" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M8 40 L8 8 L40 8" fill="none" stroke="#b98a3e" stroke-width="1.2"/>
      <path d="M14 34 L14 14 L34 14" fill="none" stroke="rgba(185,138,62,.4)" stroke-width="1"/>
      <path d="M92 60 L92 92 L60 92" fill="none" stroke="#b98a3e" stroke-width="1.2"/>
      <path d="M86 66 L86 86 L66 86" fill="none" stroke="rgba(185,138,62,.4)" stroke-width="1"/>
    </svg>

    <div class="amblem ent ent-1" aria-hidden="true">
      <span class="halka"></span>
      <span class="halka-2"></span>
      <svg viewBox="0 0 64 64" width="74" height="74">
        <g transform="rotate(-12 32 32)">
          <ellipse cx="32" cy="22" rx="11" ry="7" fill="#c98a7d" opacity=".55" transform="rotate(20 32 22)"/>
          <ellipse cx="32" cy="22" rx="11" ry="7" fill="#d9a58a" opacity=".6" transform="rotate(-26 32 22)"/>
          <ellipse cx="32" cy="24" rx="15" ry="8" fill="#c98a7d" opacity=".5" transform="rotate(78 32 24)"/>
          <ellipse cx="32" cy="24" rx="14" ry="8" fill="#cf9778" opacity=".55" transform="rotate(-72 32 24)"/>
          <ellipse cx="32" cy="26" rx="18" ry="9" fill="#b98a3e" opacity=".28" transform="rotate(40 32 26)"/>
          <path d="M32 40 C 26 34 20 30 16 26 C 13 23 14 19 18 20 C 22 21 27 26 32 33 C 37 26 42 21 46 20 C 50 19 51 23 48 26 C 44 30 38 34 32 40 Z" fill="#a86b5e"/>
          <path d="M30 44 C 29 38 28 34 27 30 L 37 30 C 36 34 35 38 34 44 Z" fill="#a86b5e" opacity=".7"/>
          <path d="M32 26 C 30 22 26 20 23 20 C 22 20 22 21 23 22 C 25 24 28 26 32 29 C 36 26 39 24 41 22 C 42 21 42 20 41 20 C 38 20 34 22 32 26 Z" fill="#b36a58"/>
          <path d="M32 23 C 31 21 30 20 29 20 C 28.4 20 28.4 20.6 29 21.4 C 30 23 31 24 32 25 C 33 24 34 23 35 21.4 C 35.6 20.6 35.6 20 35 20 C 34 20 33 21 32 23 Z" fill="#8f5345"/>
        </g>
      </svg>
    </div>

    <div class="rozet ent ent-2">İyi ki doğdun</div>

    <h1 class="baslik ent ent-3">DOĞUM GÜNÜN<br>KUTLU OLSUN</h1>
    <div class="ayrac ent ent-4" aria-hidden="true"><span>◆</span></div>

    <h2 class="isim" id="isimYazisi">İSİM</h2>

    <div class="not ent ent-5">
      <p id="notYazisi">Senin için en güzel dileklerimle...</p>
    </div>

    <button class="btn" id="buton" type="button">🎉 Kutlamayı Başlat</button>

  </section>
</main>

<footer class="altnot"><span class="kalpAt" aria-hidden="true">❤️</span> QR ile gönderildi</footer>

<script>
// === GİZLİLİK KATMANI: Kilit ekranı ===
(function(){
var _p=new URLSearchParams(location.search),_a=_p.get('anahtar'),_sH=_p.get('sifre'),_sD=_p.get('sifreDuz');
if(!_a||!_sH){return}
document.documentElement.classList.add('kilitli');
var _st=document.createElement('style');
_st.textContent='html.kilitli body>*:not(#pgKilit){visibility:hidden!important}';
document.head.appendChild(_st);
var _ov=document.createElement('div');
_ov.id='pgKilit';
_ov.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#1f2537,#2c3146);color:#f2ead8;font-family:system-ui,sans-serif;text-align:center;padding:24px';
_ov.innerHTML='<div style="font-size:3rem">\uD83D\uDD12</div><h2 style="font-size:1.5rem;font-weight:700;margin:0">Kart Kilitli</h2><p style="font-size:.95rem;opacity:.85;margin:0">Do\u011Fum g\u00FCn\u00FCn\u00FC a\u00E7mak i\u00E7in PIN kodunu gir:</p><input id="pgPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:22px;letter-spacing:6px;text-align:center;padding:10px 14px;border-radius:10px;border:1px solid #c9a86a;background:rgba(255,255,255,.08);color:#fff;outline:none"><button id="pgAc" style="background:#c9a86a;color:#1f2537;font-weight:700;border-radius:999px;padding:10px 22px;border:none;cursor:pointer;font-size:1rem">\uD83D\uDD25 Kart\u0131 A\u00E7</button><p id="pgHata" style="display:none;color:#ff6b6b;font-size:.88rem;margin:0">PIN yanl\u0131\u015F, tekrar dene.</p>';
document.body.appendChild(_ov);
var _sk=document.createElement('style');
_sk.textContent='@keyframes pgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}';
document.head.appendChild(_sk);
var _pinI=document.getElementById('pgPin'),_btn=document.getElementById('pgAc'),_err=document.getElementById('pgHata');
function _h(d){if(typeof crypto!=='undefined'&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(d)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}return Promise.resolve(null)}
async function _ac(){var g=_pinI.value.trim();if(!g)return;var ok=false;if(_sH){var h=await _h(_a+'|'+g);if(h){ok=(h===_sH)}}if(!ok&&_sD){ok=(g===_sD)}if(ok){document.documentElement.classList.remove('kilitli');_ov.style.transition='opacity .4s';_ov.style.opacity='0';setTimeout(function(){_ov.remove()},420);document.querySelectorAll('*').forEach(function(el){var n=getComputedStyle(el).animationName;if(n&&n!=='none'){el.style.animation='none';void el.offsetWidth;el.style.animation=''}})}else{_err.style.display='block';_pinI.value='';_ov.style.animation='none';void _ov.offsetWidth;_ov.style.animation='pgShake .4s ease'}}
_btn.addEventListener('click',_ac);
_pinI.addEventListener('keydown',function(e){if(e.key==='Enter')_ac()});
})();

// ==================== BURAYA İSMİ VE NOTU YAZ ====================
const VARSAYILAN_ISIM = "İSİM";
const VARSAYILAN_NOT  = "Senin için en güzel dileklerimle...";
// =================================================================

// --- URL parametrelerinden isim ve notu oku (yoksa varsayılan) ---
var params = new URLSearchParams(location.search);
var ISIM = (params.get('isim') || '').trim() || VARSAYILAN_ISIM;
var NOT  = (params.get('not')  || '').trim() || VARSAYILAN_NOT;

// --- İsim ve notu yazdır ---
document.getElementById('isimYazisi').textContent = ISIM;
document.getElementById('notYazisi').textContent  = NOT;
document.title = 'Doğum günün kutlu olsun, ' + ISIM + '!';

// --- Gül yaprakları ---
var ortam = document.getElementById('ortam');
var petalRenkleri = ['#c98a7d', '#dfb6a0', '#b98a3e', '#e8cf8f', '#a86b5e'];
var i;
for (i = 0; i < 9; i++) {
  var p = document.createElement('div');
  p.className = 'petal';
  var s = 13 + Math.random() * 9;
  p.style.left = (2 + Math.random() * 92) + '%';
  p.style.animationDuration = (15 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 13) + 's';
  p.innerHTML = '<svg viewBox="0 0 26 30" width="' + s + '" height="' + Math.round(s * 1.15) + '">' +
    '<path d="M13 2 C 21 8 23 17 13 28 C 3 17 5 8 13 2 Z" fill="' + petalRenkleri[i % petalRenkleri.length] + '" opacity=".85"/>' +
    '<path d="M13 5 C 17 10 18 15 13 24" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>' +
    '</svg>';
  ortam.appendChild(p);
}

// --- Konfeti motoru ---
var cv = document.getElementById('konfeti');
var cx = cv.getContext('2d');
var renkler = ['#d9b36a', '#b98a3e', '#e8cf8f', '#c98a7d', '#f3d9ce', '#8a5f2a'];
var DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
function boyutla() {
  cv.width = Math.floor(innerWidth * DPR);
  cv.height = Math.floor(innerHeight * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
boyutla();
window.addEventListener('resize', boyutla);
var azHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var parcaciklar = [];

function patlat(x, y, adet) {
  for (var t = 0; t < adet; t++) {
    var aci = Math.random() * Math.PI * 2;
    var hiz = 1.8 + Math.random() * 4.2;
    parcaciklar.push({
      x: x, y: y,
      vx: Math.cos(aci) * hiz,
      vy: Math.sin(aci) * hiz - 2.8,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.24,
      boy: 4 + Math.random() * 6,
      renk: renkler[(Math.random() * renkler.length) | 0],
      sekil: Math.random() < 0.3 ? 2 : (Math.random() < 0.5 ? 0 : 1),
      omur: 110 + Math.random() * 70,
      op: 1
    });
  }
}
function yagmur() {
  parcaciklar.push({
    x: Math.random() * innerWidth, y: -10,
    vx: (Math.random() - 0.5) * 0.4,
    vy: 0.35 + Math.random() * 0.75,
    rot: Math.random() * 6.28, vr: 0.015,
    boy: 3.5 + Math.random() * 5,
    renk: renkler[(Math.random() * renkler.length) | 0],
    sekil: Math.random() < 0.5 ? 0 : 1,
    omur: 340, op: 1
  });
}
var son = 0;
function dongu(zaman) {
  requestAnimationFrame(dongu);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  if (!azHareket && zaman - son > 700 && parcaciklar.length < 90) {
    son = zaman;
    yagmur();
  }
  for (var t = parcaciklar.length - 1; t >= 0; t--) {
    var p = parcaciklar[t];
    p.vy += 0.08; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.omur--;
    p.op = Math.min(1, p.omur / 80);
    if (p.y > innerHeight + 30 || p.omur <= 0) { parcaciklar.splice(t, 1); continue; }
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.max(0, p.op);
    cx.fillStyle = p.renk;
    if (p.sekil === 2) {
      cx.beginPath();
      cx.moveTo(0, -p.boy);
      cx.lineTo(p.boy, 0);
      cx.lineTo(0, p.boy);
      cx.lineTo(-p.boy, 0);
      cx.closePath();
      cx.fill();
    }
    else if (p.sekil === 0) { cx.fillRect(-p.boy / 2, -p.boy / 2, p.boy, p.boy * 0.6); }
    else { cx.beginPath(); cx.arc(0, 0, p.boy / 2, 0, 6.283); cx.fill(); }
    cx.restore();
  }
}
requestAnimationFrame(dongu);

// --- Açılışta nazik kutlama patlaması ---
setTimeout(function () {
  patlat(innerWidth * 0.5, innerHeight * 0.5, 85);
  setTimeout(function () { patlat(innerWidth * 0.25, innerHeight * 0.66, 45); }, 220);
  setTimeout(function () { patlat(innerWidth * 0.75, innerHeight * 0.6, 45); }, 440);
}, 450);

// --- Buton: büyük kutlama ---
var buton = document.getElementById('buton');
var isimEl = document.getElementById('isimYazisi');
buton.addEventListener('click', function () {
  patlat(innerWidth * 0.5, innerHeight * 0.45, 130);
  setTimeout(function () { patlat(innerWidth * 0.2, innerHeight * 0.62, 70); }, 160);
  setTimeout(function () { patlat(innerWidth * 0.8, innerHeight * 0.5, 70); }, 320);
  isimEl.classList.remove('hop');
  void isimEl.offsetWidth;
  isimEl.classList.add('hop');
  buton.textContent = '🎊 Tekrar Kutla!';
});
</script>
<link rel="stylesheet" href="deneyim-cekirdegi.css"><script src="dny3-a.js"></script><script src="dny3-b.js"></script><script src="dny3-c.js"></script><script src="dny3-d.js"></script><script src="zarf-motoru.js"></script>
</body>
</html>
